aid: tongal
name: Tongal
description: >-
  Tongal is a Santa Monica, California creative content platform ("your studio
  on demand") that connects brands and studios with a global community of
  writers, directors, and production companies. Founded in 2009 and backed by
  Insight Partners, Tongal runs branded video, advertising, and
  original-content projects through ideation, pitch, and production phases for
  clients such as LEGO, Procter & Gamble, Unilever, NASA, and Lucasfilm. Tongal
  publishes no public developer API — api.tongal.com is the private GraphQL
  backing API for its web app, with introspection disabled.
